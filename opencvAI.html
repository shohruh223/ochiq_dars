<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDP Junior — Opencv Sun'iy intellekt</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyanBrand: '#19d4e5',
            deep: '#0f172a',
            ink: '#082032',
            violetSoft: '#7c3aed',
            pinkSoft: '#ec4899'
          },
          boxShadow: {
            glow: '0 0 40px rgba(25,212,229,.30)',
            soft: '0 20px 60px rgba(15,23,42,.12)',
            video: '0 18px 40px rgba(2, 6, 23, .18)'
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: #edf3f7;
      color: #0f172a;
      overflow: hidden;
    }

    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,.86);
    }

    .slider-window {
      width: 100%;
      height: calc(100vh - 82px);
      overflow: hidden;
      position: relative;
    }

    .slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform .75s cubic-bezier(.65, 0, .35, 1);
      will-change: transform;
    }

    .slide {
      min-width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem .9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .slide-inner {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(15,23,42,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,23,42,.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .compact-head {
      margin-bottom: 2.35rem;
      text-align: center;
    }

    .compact-head h1,
    .compact-head h2 { line-height: 1.05; }

    .video-frame, .hero-video {
      width: 100%;
      max-width: 896px;
      height: 430px;
      min-height: 430px;
      margin: 0 auto;
      border-radius: 2rem;
      overflow: hidden;
      background: #000;
      box-shadow: 0 18px 40px rgba(2, 6, 23, .18);
      display: flex;
    }

    .video-frame video, .hero-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: all .65s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(15,23,42,.18);
      border-radius: 999px;
    }

    .nav-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    @media (max-width: 900px) {
      body { overflow: hidden; }
      .slider-window { height: calc(100vh - 74px); }
      .slide { padding: .75rem .75rem 1rem; align-items: center; }
      .video-frame, .hero-video {
        height: 320px;
        min-height: 320px;
        border-radius: 1.5rem;
      }
      .compact-head { margin-bottom: 1.5rem; }
    }

    @media (max-width: 520px) {
      .video-frame, .hero-video {
        height: 235px;
        min-height: 235px;
      }
    }
  </style>
</head>
<body class="text-deep">
  <header class="h-[82px] glass border-b border-slate-200 flex items-center justify-between px-5 md:px-10 relative z-20">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-full bg-cyanBrand flex items-center justify-center shadow-glow">
        <div class="w-7 h-4 rounded-full bg-deep flex items-center justify-center text-[8px] text-cyanBrand font-black">&gt;_</div>
      </div>
      <div class="leading-none">
        <div class="font-black text-xl tracking-tight text-ink">PDP</div>
        <div class="font-bold text-sm text-cyanBrand">Junior</div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button class="nav-btn w-10 h-10 rounded-full border border-slate-300 bg-white text-slate-500 hover:text-cyanBrand hover:border-cyanBrand transition" id="prevBtn" title="Oldingi bet">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-bold text-sm" id="counter">1 / 4</div>
      <button class="nav-btn w-10 h-10 rounded-full bg-cyanBrand text-white shadow-glow hover:scale-105 transition" id="nextBtn" title="Keyingi bet">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </header>

  <main class="slider-window" id="touchArea">
    <div class="slides-wrapper" id="slidesWrapper">
      <section class="slide bg-white grid-bg custom-scrollbar">
        <div class="slide-inner">
          <div class="compact-head reveal active">
            <div class="inline-block px-4 py-1 rounded-full bg-cyanBrand/10 text-cyanBrand font-black uppercase tracking-[0.18em] text-xs mb-4">1-bet</div>
            <h1 class="text-4xl md:text-5xl font-black tracking-tight">Dron boshqaruvi</h1>
          </div>
          <div class="reveal active flex items-center justify-center">
            <div class="video-frame">
              <video autoplay controls loop muted playsinline preload="auto" src="1.mp4"></video>
            </div>
          </div>
        </div>
      </section>

      <section class="slide bg-white grid-bg custom-scrollbar">
        <div class="slide-inner">
          <div class="compact-head reveal">
            <div class="inline-block px-4 py-1 rounded-full bg-cyanBrand/10 text-cyanBrand font-black uppercase tracking-[0.18em] text-xs mb-4">2-bet</div>
            <h2 class="text-4xl md:text-5xl font-black tracking-tight">Finger control</h2>
          </div>
          <div class="reveal flex items-center justify-center">
            <div class="hero-video">
              <video autoplay controls loop muted playsinline preload="auto" src="finger%20control.mp4"></video>
            </div>
          </div>
        </div>
      </section>

      <section class="slide bg-white grid-bg custom-scrollbar">
        <div class="slide-inner">
          <div class="compact-head reveal">
            <div class="inline-block px-4 py-1 rounded-full bg-cyanBrand/10 text-cyanBrand font-black uppercase tracking-[0.18em] text-xs mb-4">3-bet</div>
            <h2 class="text-4xl md:text-5xl font-black tracking-tight">FitTrack monitor loyihasi</h2>
          </div>
          <div class="reveal mt-6 flex items-center justify-center">
            <div class="video-frame">
              <video autoplay controls loop muted playsinline preload="auto" src="fittrack.mp4"></video>
            </div>
          </div>
        </div>
      </section>

      <section class="slide bg-white grid-bg custom-scrollbar">
        <div class="slide-inner">
          <div class="compact-head reveal">
            <div class="inline-block px-4 py-1 rounded-full bg-cyanBrand/10 text-cyanBrand font-black uppercase tracking-[0.18em] text-xs mb-4">4-bet</div>
            <h2 class="text-4xl md:text-5xl font-black tracking-tight">Virtual boshqaruv</h2>
          </div>
          <div class="reveal flex items-center justify-center">
            <div class="hero-video">
              <video autoplay controls loop muted playsinline preload="auto" src="virtual%20mouse.mp4"></video>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slides = Array.from(document.querySelectorAll('.slide'));
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;

    function pauseHiddenVideos() {
      slides.forEach((slide, index) => {
        slide.querySelectorAll('video').forEach(video => {
          if (index === current) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        });
      });
    }

    function revealCurrent() {
      slides[current].querySelectorAll('.reveal').forEach((el, i) => {
        setTimeout(() => el.classList.add('active'), i * 80);
      });
    }

    function updateSlide() {
      slidesWrapper.style.transform = `translateX(-${current * 100}%)`;
      counter.textContent = `${current + 1} / ${slides.length}`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
      revealCurrent();
      pauseHiddenVideos();
    }

    prevBtn.addEventListener('click', () => {
      if (current > 0) {
        current--;
        updateSlide();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (current < slides.length - 1) {
        current++;
        updateSlide();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' && current < slides.length - 1) {
        current++;
        updateSlide();
      }
      if (e.key === 'ArrowLeft' && current > 0) {
        current--;
        updateSlide();
      }
    });

    let startX = 0;
    const touchArea = document.getElementById('touchArea');
    touchArea.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].screenX;
    }, { passive: true });

    touchArea.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - startX;
      if (diff < -50 && current < slides.length - 1) {
        current++;
        updateSlide();
      }
      if (diff > 50 && current > 0) {
        current--;
        updateSlide();
      }
    }, { passive: true });

    updateSlide();
  </script>
</body>
</html>
