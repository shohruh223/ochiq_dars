<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDP Junior — OpenCV loyihalari</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyanBrand: '#19d4e5',
            deep: '#0f172a',
            ink: '#082032',
            violetSoft: '#7c3aed',
            pinkSoft: '#ec4899'
          },
          boxShadow: {
            glow: '0 0 40px rgba(25,212,229,.26)',
            soft: '0 18px 50px rgba(15,23,42,.10)',
            frame: '0 12px 32px rgba(2,6,23,.14)'
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background:
        linear-gradient(rgba(15,23,42,.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,23,42,.075) 1px, transparent 1px),
        linear-gradient(135deg, rgba(25,212,229,.16), rgba(255,255,255,.90) 42%, rgba(124,58,237,.08));
      background-size: 28px 28px, 28px 28px, auto;
      color: #0f172a;
    }

    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,.88);
    }

    .page-wrap {
      min-height: calc(100vh - 82px);
      padding: 1.35rem 1.15rem 1.8rem;
    }

    .projects-grid {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.15rem;
      align-items: stretch;
    }

    .project-card {
      position: relative;
      overflow: hidden;
      border-radius: 1.7rem;
      border: 1px solid rgba(203,213,225,.92);
      background: rgba(255,255,255,.90);
      box-shadow: 0 18px 50px rgba(15,23,42,.08);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .project-card::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 999px;
      background: rgba(25,212,229,.11);
      right: -70px;
      top: -70px;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: #19d4e5;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: .35rem;
    }

    .card-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .75rem;
      min-height: 76px;
    }

    .card-title {
      font-size: clamp(1.35rem, 1.55vw, 2rem);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -.04em;
      color: #0f172a;
    }

    .icon-chip {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: rgba(25,212,229,.13);
      color: #19d4e5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex: 0 0 auto;
    }

    .video-shell {
      position: relative;
      z-index: 1;
      margin-top: .85rem;
      width: 100%;
      border-radius: 1.25rem;
      overflow: hidden;
      background: #000;
      border: 4px solid rgba(255,255,255,.95);
      box-shadow: 0 12px 32px rgba(2,6,23,.14);
    }

    .video-stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .video-stage video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      background: #000;
    }

    @media (max-width: 1280px) {
      .projects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-wrap { min-height: auto; }
      .card-head { min-height: 70px; }
    }

    @media (max-width: 720px) {
      .projects-grid { grid-template-columns: 1fr; }
      .page-wrap { padding: .9rem .75rem 1.2rem; }
      .project-card { border-radius: 1.35rem; padding: .9rem; }
      .video-shell { border-radius: 1rem; border-width: 3px; }
      .icon-chip { width: 44px; height: 44px; }
    }
  </style>
</head>
<body class="text-deep">
  <header class="h-[82px] glass border-b border-slate-200 flex items-center justify-between gap-4 px-5 md:px-10 sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-full bg-cyanBrand flex items-center justify-center shadow-glow">
        <div class="w-7 h-4 rounded-full bg-deep flex items-center justify-center text-[8px] text-cyanBrand font-black">&gt;_</div>
      </div>
      <div class="leading-none">
        <div class="font-black text-xl tracking-tight text-ink">PDP</div>
        <div class="font-bold text-sm text-cyanBrand">Junior</div>
      </div>
    </div>

    <div class="hidden md:flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-slate-200 shadow-sm">
      <i class="fa-solid fa-robot text-cyanBrand"></i>
      <span class="font-black text-slate-700">OpenCV sun'iy intellekt loyihalari</span>
    </div>
  </header>

  <main class="page-wrap">
    <div class="projects-grid">
      <section class="project-card">
        <div class="card-head">
          <div>
            <div class="badge">1-loyiha</div>
            <h1 class="card-title">Dron boshqaruvi</h1>
          </div>
          <div class="icon-chip"><i class="fa-solid fa-helicopter"></i></div>
        </div>
        <div class="video-shell">
          <div class="video-stage">
            <video autoplay controls loop muted playsinline preload="metadata" src="opencv_video/1.mp4"></video>
          </div>
        </div>
      </section>

      <section class="project-card">
        <div class="card-head">
          <div>
            <div class="badge">2-loyiha</div>
            <h2 class="card-title">Finger control</h2>
          </div>
          <div class="icon-chip"><i class="fa-solid fa-hand-pointer"></i></div>
        </div>
        <div class="video-shell">
          <div class="video-stage">
            <video autoplay controls loop muted playsinline preload="metadata" src="opencv_video/finger%20control.mp4"></video>
          </div>
        </div>
      </section>

      <section class="project-card">
        <div class="card-head">
          <div>
            <div class="badge">3-loyiha</div>
            <h2 class="card-title">FitTrack monitor</h2>
          </div>
          <div class="icon-chip"><i class="fa-solid fa-heart-pulse"></i></div>
        </div>
        <div class="video-shell">
          <div class="video-stage">
            <video autoplay controls loop muted playsinline preload="metadata" src="opencv_video/fittrack.mp4"></video>
          </div>
        </div>
      </section>

      <section class="project-card">
        <div class="card-head">
          <div>
            <div class="badge">4-loyiha</div>
            <h2 class="card-title">Virtual boshqaruv</h2>
          </div>
          <div class="icon-chip"><i class="fa-solid fa-computer-mouse"></i></div>
        </div>
        <div class="video-shell">
          <div class="video-stage">
            <video autoplay controls loop muted playsinline preload="metadata" src="opencv_video/virtual%20mouse.mp4"></video>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
