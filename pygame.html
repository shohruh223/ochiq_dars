<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDP Junior — Pygame loyihalari</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyanBrand: '#22d3ee',
            deep: '#0f172a',
            ink: '#0b132b'
          },
          boxShadow: {
            glow: '0 10px 40px rgba(34,211,238,.18)',
            soft: '0 18px 50px rgba(15, 23, 42, .10)',
            frame: '0 10px 28px rgba(15, 23, 42, .10)'
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: #0f172a;
      background:
        linear-gradient(to right, rgba(15,23,42,.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15,23,42,.08) 1px, transparent 1px),
        linear-gradient(135deg, rgba(34,211,238,.12), rgba(255,255,255,.88) 38%, rgba(34,197,94,.10));
      background-size: 28px 28px, 28px 28px, auto;
    }

    .glass {
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.84);
    }

    .project-card {
      border-radius: 2rem;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(203,213,225,.9);
      box-shadow: 0 18px 50px rgba(15,23,42,.08);
      padding: 1.4rem 1.4rem 1rem;
      height: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: #22d3ee;
      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: .45rem;
    }

    .icon-chip {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: rgba(34,211,238,.13);
      color: #22d3ee;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .video-shell {
      background: #fff;
      border-radius: 1.7rem;
      padding: 0;
      overflow: hidden;
      border: 3px solid #0f172a;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .10);
      margin-top: 1rem;
      position: relative;
    }

    .video-stage {
      position: relative;
      overflow: hidden;
      background: #000;
      width: 100%;
    }

    .video-stage video {
      width: 100%;
      height: 100%;
      display: block;
      object-position: center center;
    }

    .stage-dino {
      aspect-ratio: 16 / 9;
    }

    .stage-dino video {
      object-fit: cover;
      transform: scale(1.02);
    }

    .shell-flappy {
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .stage-flappy {
      aspect-ratio: 1182 / 1080;
    }

    .stage-flappy video {
      object-fit: cover;
      object-position: center center;
      transform: scale(1);
      transform-origin: center center;
    }

    .hint-text {
      color: #64748b;
      font-size: .92rem;
      font-weight: 600;
      margin-top: .85rem;
    }

    @media (max-width: 1200px) {
      .project-card { padding: 1.2rem 1.2rem 1rem; }
    }

    @media (max-width: 1280px) {
      .shell-flappy { max-width: 520px; }
      .stage-flappy { aspect-ratio: 1182 / 1080; }
    }

    @media (max-width: 768px) {
      .project-card { border-radius: 1.5rem; }
      .video-shell { border-radius: 1.25rem; }
      .icon-chip { width: 52px; height: 52px; font-size: 1.3rem; }
      .shell-flappy { max-width: 100%; }
      .stage-flappy { aspect-ratio: 1182 / 1080; }
      .stage-flappy video { object-position: center center; transform: scale(1); }
    }
  </style>
</head>
<body>
  <header class="glass border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full bg-cyanBrand flex items-center justify-center shadow-glow">
          <div class="w-7 h-4 rounded-full bg-deep flex items-center justify-center text-[8px] text-cyanBrand font-black">&gt;_</div>
        </div>
        <div class="leading-none">
          <div class="font-black text-xl tracking-tight text-ink">PDP</div>
          <div class="font-bold text-sm text-cyanBrand">Junior</div>
        </div>
      </div>

      <div class="hidden md:flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-slate-200 shadow-sm">
        <i class="fa-solid fa-gamepad text-cyanBrand"></i>
        <span class="font-black text-slate-700">Pygame loyihalari</span>
      </div>
    </div>
  </header>

  <main class="max-w-[1500px] mx-auto px-4 md:px-8 py-6 md:py-8">
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 xl:gap-5 items-start">

      <section class="project-card">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="badge">1-loyiha</div>
            <h1 class="text-[2rem] md:text-[2.4rem] font-black tracking-tight leading-none text-slate-900">Dino Game</h1>
          </div>
          <div class="icon-chip"><i class="fa-solid fa-person-running"></i></div>
        </div>

        <div class="video-shell">
          <div class="video-stage stage-dino">
            <video autoplay controls loop muted playsinline preload="metadata" src="pygame_video/dino.mp4"></video>
          </div>
        </div>

      </section>

      <section class="project-card">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="badge">2-loyiha</div>
            <h2 class="text-[2rem] md:text-[2.4rem] font-black tracking-tight leading-none text-slate-900">Flappy Bird</h2>
          </div>
          <div class="icon-chip"><i class="fa-solid fa-dove"></i></div>
        </div>

        <div class="video-shell shell-flappy">
          <div class="video-stage stage-flappy">
            <video autoplay controls loop muted playsinline preload="metadata" src="pygame_video/flappy.mp4"></video>
          </div>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
